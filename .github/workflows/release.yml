name: Release immutable image and deploy

on:
  workflow_run:
    workflows: ["Quality and deployment smoke test"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.reference }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve tested source revision
        id: source
        env:
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
      - name: Log in to GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable OCI image
        id: image
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${SOURCE_SHA}"
          docker build --pull --tag "$image" --file deploy/Dockerfile .
          docker push "$image"
          echo "reference=$image" >> "$GITHUB_OUTPUT"

  staging:
    needs: publish
    environment:
      name: staging
      url: ${{ vars.PUBLIC_URL }}
    # This is the dedicated Windows runner attached to the local Podman staging
    # machine. It is intentionally not used by pull-request quality checks.
    runs-on: [self-hosted, windows, odoo-staging]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $podman = Join-Path $env:LOCALAPPDATA 'Programs\Podman\podman.exe'
          $env:GITHUB_TOKEN | & $podman login ghcr.io --username $env:GITHUB_ACTOR --password-stdin
      - name: Deploy tested immutable image to staging
        shell: powershell
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: .\deploy\podman\deploy-local-staging.ps1 -Image $env:IMAGE
