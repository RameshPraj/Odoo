# One artefact dev and production can both run (audit finding CI-2).
#
# ============================================================================
# NEVER RUN. Docker is not installed on the machine where this was written, so
# neither this file nor deploy/Dockerfile has been executed even once. CI-2
# remains OPEN until a container has served a request.
# ============================================================================
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# Deliberately NOT a production deployment on its own: there is no TLS, no
# reverse proxy, and no backup. Production still needs the nginx rules in
# deploy/README.md -- in particular SAAS-6, blocking /web/database/* at the edge.

name: odoo19-np

services:
  db:
    image: postgres:17-bookworm
    environment:
      # Read from the host environment or a .env file; never defaulted. A
      # compose file with a default password is how SEC-1 happened, and those
      # credentials were published in a document before they were rotated.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Odoo's own startup gives a confusing error if the database is not ready,
      # so the app waits on this rather than on the container merely existing.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host: nothing outside this network needs PostgreSQL,
    # and PG-1/PG-2 are about reducing exactly this surface.
    expose:
      - "5432"

  odoo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Consumed by the config template, not by Odoo directly.
      HOST: db
      USER: ${POSTGRES_USER:?set POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      # The config carries credentials and is gitignored, so it is mounted rather
      # than baked into the image. Copy deploy/odoo.conf.container.example, then
      # set unique strong values before bringing this stack up.
      - ./odoo.conf.container:/etc/odoo/odoo.conf:ro
      # The filestore must outlive the container. A database dump without the
      # filestore from the same instant restores to a database full of broken
      # attachments -- see OPS-1 and DAT-1.
      - filestore:/var/lib/odoo
    ports:
      - "127.0.0.1:8069:8069"
    restart: unless-stopped

volumes:
  db-data:
  filestore:
